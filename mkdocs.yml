# ------------------------------------------------------------
# SEO / GEO：Open Graph、Twitter Card、结构化数据（WebSite / Article）
# 由 docs/javascripts/extra.js 在客户端注入。
# 说明：当前 Material 9.7.6 的 base.html 不会自动渲染 config.extra_head，
# 因此统一改用 extra.js 注入，确保 AI 搜索引擎（GEO 目标）与浏览器都能取到。
# 已静态落地的 SEO 信号：<link rel=canonical>（site_url）、每页独立
# meta description（front matter）、sitemap.xml、robots.txt、llms.txt /
# llms-full.txt。
# ------------------------------------------------------------

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js
