# ============================================================
# Material for MkDocs 站点配置
# 目标：Markdown 内容一比一忠实还原，可直接双击 site/index.html 离线浏览
# 文档：https://squidfunk.github.io/mkdocs-material/
# ============================================================

site_name: V2Ray 帮助文档
site_description: V2Ray 代理软件完整中文帮助文档与配置教程：安装、传输协议、路由、TLS、WebSocket、透明代理等。
site_url: https://martlet121.github.io/   # GitHub Pages 部署地址；用于 canonical / sitemap / OG
site_author: V2Ray 帮助文档
copyright: Copyright &copy; 2026 V2Ray 帮助文档
docs_dir: docs
# 关键：false -> 每个 .md 生成同名 .html（如 "1 介绍V2Ray.html"），
# 这样正文中 "./files/xxx.png" 的相对引用在 file:// 下也能正确解析。
use_directory_urls: false

theme:
  name: material
  language: zh
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.top
    - toc.follow

markdown_extensions:
  - markdown.extensions.nl2br
  - hardbreak
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
      toc_depth: 6
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# ------------------------------------------------------------
# 导航：左侧目录名 = Markdown 文件名（去掉 .md 后缀，文件名其余部分不变）
# 不含 index.md（介绍首页通过站点标题/首页按钮进入）
# ------------------------------------------------------------
